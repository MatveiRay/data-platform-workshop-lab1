version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dpw-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dpw-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    container_name: dpw-redis
    ports:
      - "6379:6379"

  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: dpw-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - ./flink_job:/opt/flink/usrlib

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: dpw-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink_job:/opt/flink/usrlib

  airflow:
    image: apache/airflow:2.7.1-python3.9
    container_name: dpw-airflow
    depends_on:
      - kafka
      - redis
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC_AGG: "aggregated_clicks"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      BQ_PROJECT_ID: "${BQ_PROJECT_ID:-your-project}"
      BQ_RAW_DATASET: "${BQ_RAW_DATASET:-raw}"
      BQ_DWH_DATASET: "${BQ_DWH_DATASET:-dwh}"
      BQ_ORDERS_TABLE: "${BQ_ORDERS_TABLE:-orders}"
      BQ_TOP_TABLE: "${BQ_TOP_TABLE:-top_products}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./requirements-airflow.txt:/opt/airflow/requirements.txt
      - ./sql:/opt/airflow/sql
    command: >
      bash -lc "pip install --user -r /opt/airflow/requirements.txt
      && airflow standalone"
